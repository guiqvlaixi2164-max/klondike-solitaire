name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run unit tests (no dependencies to install)
        run: npm test
      - name: Verify every bundled deal is winnable (issue #1)
        run: npm run verify
